<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    {% include 'partials/app_theme.html' %}
    <style>
        .citation-highlight {
            background: var(--color-teal-soft);
            border: 1px solid rgba(13, 148, 136, 0.35);
            color: var(--color-teal-hover);
            padding: 2px 6px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            display: inline-block;
            margin: 2px 0;
        }
        .msg-user {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--color-border);
            color: var(--color-text);
        }
        .msg-assistant {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(10px);
            border: 1px solid var(--color-border);
        }
        .avatar-ai {
            background: linear-gradient(145deg, var(--color-teal), var(--color-teal-hover));
            color: #fff;
        }
        .chip-btn {
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            background: rgba(255, 255, 255, 0.7);
            color: var(--color-text-secondary);
            font-size: 0.75rem;
            padding: 0.4rem 0.65rem;
            white-space: nowrap;
        }
        .chip-btn:hover {
            border-color: rgba(13, 148, 136, 0.35);
            background: #fff;
            color: var(--color-text);
        }
        .prose p { margin-bottom: 0.5rem; color: var(--color-text-secondary); line-height: 1.6; }
        .prose strong { color: var(--color-text); }
    </style>
</head>
<body class="app-theme app-bg min-h-screen flex flex-col antialiased">

    <header class="glass-bar sticky top-0 z-40 h-14 flex items-center justify-between px-4 sm:px-5">
        <div class="flex items-center gap-2 min-w-0">
            <a href="/" class="text-[var(--color-text-muted)] hover:text-[var(--color-text)] text-sm shrink-0">Home</a>
            <span class="text-black/10">|</span>
            <h1 class="text-sm font-semibold truncate">Support assistant</h1>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
            <span class="badge hidden sm:inline-flex">{{ indexed_chunks_count }} chunks</span>
            <span id="turnCounterBadge" class="badge font-mono">Turn <span id="currentTurn">0</span></span>
            <button type="button" onclick="run10TurnDemo()" id="demoBtn" class="btn btn-secondary btn-sm hidden sm:inline-flex">10-turn demo</button>
            <button type="button" onclick="resetSession()" class="btn btn-ghost btn-sm">Reset</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col max-w-3xl mx-auto w-full px-4 py-4 min-h-0">

        <div class="glass-inset rounded-[var(--radius-lg)] px-3 py-2 mb-3 flex flex-wrap items-center justify-between gap-2 text-xs">
            <span class="text-[var(--color-text-muted)]">Topic <strong id="activeTopicBadge" class="text-[var(--color-text)] font-medium">General</strong></span>
            <span class="text-[var(--color-text-muted)]">Citations · memory · anti-repeat</span>
        </div>

        <div class="mb-3 flex gap-2 overflow-x-auto pb-1">
            <button type="button" onclick="sendPrompt('What is your SLA response time for Critical P1 outages?')" class="chip-btn">P1 SLA</button>
            <button type="button" onclick="sendPrompt('Can I get a refund if I cancel my annual subscription?')" class="chip-btn">Refunds</button>
            <button type="button" onclick="sendPrompt('Could you remind me of the refund terms for annual plans?')" class="chip-btn">Anti-repeat test</button>
            <button type="button" onclick="sendPrompt('Is multi-factor authentication mandatory for admin accounts?')" class="chip-btn">MFA</button>
            <button type="button" onclick="sendPrompt('Does warranty cover physical drop damage or liquid spills?')" class="chip-btn">Warranty</button>
        </div>

        <div id="chatMessages" class="flex-1 glass-panel rounded-[var(--radius-xl)] p-4 overflow-y-auto space-y-5 min-h-[360px] max-h-[min(60vh,560px)]">
            <div class="flex items-start gap-3 welcome-msg">
                <div class="w-8 h-8 rounded-full avatar-ai flex items-center justify-center text-[10px] font-bold shrink-0">AI</div>
                <div class="msg-assistant rounded-[var(--radius-lg)] rounded-tl-md p-4 text-sm max-w-[90%]">
                    <p class="font-medium text-[var(--color-text)]">Policy-aware support</p>
                    <p class="text-[var(--color-text-secondary)] mt-1">Ask about SLAs, billing, security, or warranty. Answers include document citations.</p>
                </div>
            </div>
        </div>

        <div id="loadingIndicator" class="hidden my-2 flex items-center gap-2 text-teal-800 text-xs font-medium">
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg>
            <span id="loadingText">Answering…</span>
        </div>

        <form id="chatForm" onsubmit="handleSubmit(event)" class="mt-3 glass-panel rounded-[var(--radius-xl)] p-2 flex items-center gap-2">
            <input
                id="messageInput"
                type="text"
                placeholder="Message support assistant…"
                autocomplete="off"
                class="flex-1 bg-transparent px-3 py-2.5 text-sm outline-none text-[var(--color-text)] placeholder-[var(--color-text-muted)]"
            >
            <button type="submit" id="sendBtn" class="btn btn-primary btn-sm shrink-0">Send</button>
        </form>
    </main>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const sendBtn = document.getElementById('sendBtn');
        const currentTurnSpan = document.getElementById('currentTurn');
        const activeTopicBadge = document.getElementById('activeTopicBadge');
        const demoBtn = document.getElementById('demoBtn');

        const welcomeHtml = chatMessages.innerHTML;

        const BENCHMARK_TURNS = [
            "What is your SLA response time for Critical P1 outages?",
            "What about Standard P3 severity issues?",
            "Can I get a refund if I cancel my annual subscription?",
            "How many days does it take for the refund money to reach my account?",
            "Could you remind me of the refund terms for annual plans?",
            "Is multi-factor authentication mandatory for admin accounts?",
            "What is the protocol if an administrator loses both password and 2FA recovery codes?",
            "What features and pricing are included in the Professional Plan?",
            "Does warranty cover physical drop damage or liquid spills?",
            "How long before a missing package is officially declared Lost in Transit?"
        ];

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex items-start justify-end gap-3';
            div.innerHTML = `
                <div class="msg-user rounded-[var(--radius-lg)] rounded-tr-md p-3.5 max-w-[85%] text-sm">${escapeHtml(text)}</div>
                <div class="w-8 h-8 rounded-full glass-inset flex items-center justify-center text-[10px] font-semibold text-[var(--color-text-secondary)] shrink-0">You</div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function highlightCitations(text) {
            const citationRegex = /\[Doc:\s*([^,\]]+),\s*Page:\s*([^,\]]+)(?:,\s*Section:\s*([^\]]+))?\]/gi;
            return text.replace(citationRegex, function(match, doc, page, sec) {
                const secPart = sec ? `, Section: ${sec.trim()}` : '';
                return `<span class="citation-highlight">Doc: ${doc.trim()}, p.${page.trim()}${secPart}</span>`;
            });
        }

        function appendAssistantResponse(data) {
            const div = document.createElement('div');
            div.className = 'flex items-start gap-3';

            if (data.turn_number) currentTurnSpan.textContent = data.turn_number;
            if (data.topic) activeTopicBadge.textContent = data.topic;

            let metaBanner = '';
            if (data.is_topic_switch) {
                const switchTitle = data.returning_to_previous_topic
                    ? `Back to <strong>${escapeHtml(data.topic)}</strong>`
                    : `Now discussing <strong>${escapeHtml(data.topic)}</strong>`;
                metaBanner = `<p class="text-xs text-[var(--color-teal)] mb-2 font-medium">${switchTitle}</p>`;
            }

            let citationBox = '';
            if (data.citations && data.citations.length > 0) {
                const pills = data.citations.map(c =>
                    `<span class="inline-block text-[10px] font-mono px-2 py-0.5 rounded-md bg-[var(--color-teal-soft)] text-[var(--color-teal-hover)] border border-teal-600/20 mr-1 mb-1">${escapeHtml(c)}</span>`
                ).join('');
                citationBox = `<div class="mt-3 pt-2 border-t border-[var(--color-border)]">${pills}</div>`;
            }

            let formattedReply = marked.parse(data.reply || '');
            formattedReply = highlightCitations(formattedReply);

            div.innerHTML = `
                <div class="w-8 h-8 rounded-full avatar-ai flex items-center justify-center text-[10px] font-bold shrink-0">AI</div>
                <div class="msg-assistant rounded-[var(--radius-lg)] rounded-tl-md p-4 max-w-[90%] text-sm">
                    ${metaBanner}
                    <div class="prose max-w-none text-sm">${formattedReply}</div>
                    ${citationBox}
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(string) {
            return String(string || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function sendPrompt(text) {
            messageInput.value = text;
            await handleSubmit(new Event('submit'));
        }

        async function resetSession(skipConfirm = false) {
            if (!skipConfirm && !confirm('Clear conversation?')) return;
            const csrftoken = getCookie('csrftoken');
            try {
                await fetch('/task2/api/reset/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrftoken }
                });
                chatMessages.innerHTML = welcomeHtml.replace('Policy-aware support', 'New chat');
                currentTurnSpan.textContent = '0';
                activeTopicBadge.textContent = 'General';
            } catch (err) {
                console.error(err);
            }
        }

        async function handleSubmit(e) {
            if (e) e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            loadingIndicator.classList.remove('hidden');
            scrollToBottom();

            const csrftoken = getCookie('csrftoken');

            try {
                const response = await fetch('/task2/api/support_chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                appendAssistantResponse(data);
            } catch (err) {
                appendAssistantResponse({ reply: `**Error:** ${err.message}` });
            } finally {
                loadingIndicator.classList.add('hidden');
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        async function run10TurnDemo() {
            demoBtn.disabled = true;
            await resetSession(true);
            for (const query of BENCHMARK_TURNS) {
                messageInput.value = query;
                await handleSubmit(new Event('submit'));
                await new Promise(r => setTimeout(r, 1000));
            }
            demoBtn.disabled = false;
        }
    </script>
</body>
</html>
