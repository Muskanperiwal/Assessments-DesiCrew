<script>
    (function() {
        try {
            var savedTheme = localStorage.getItem('app_theme');
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.classList.remove('dark');
            }
        } catch(e) {}
        syncTailwindDarkClass();
    })();

    /** Tailwind uses .dark; app UI uses data-theme — keep them aligned. */
    function syncTailwindDarkClass() {
        var theme = document.documentElement.getAttribute('data-theme') || 'light';
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }

    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        syncTailwindDarkClass();
        try { localStorage.setItem('app_theme', next); } catch(e) {}
        updateThemeToggleLabels(next);
    }

    function updateThemeToggleLabels(theme) {
        var isDark = theme === 'dark';
        var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        document.querySelectorAll('.theme-toggle-btn').forEach(function(btn) {
            btn.setAttribute('aria-label', label);
            btn.setAttribute('title', label);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            syncTailwindDarkClass();
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            updateThemeToggleLabels(current);
        });
    } else {
        syncTailwindDarkClass();
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        updateThemeToggleLabels(current);
    }
</script>
